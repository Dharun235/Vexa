[project]
name = "vexa"
version = "0.1.0"
description = "A beginner-friendly computer vision language and local playground"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "lark>=1.2,<2", "onnxruntime>=1.20,<2", "numpy>=2,<3", "opencv-python>=4.10,<5"]

[dependency-groups]
export = ["ultralytics>=8.3,<9", "onnx>=1.17,<2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
