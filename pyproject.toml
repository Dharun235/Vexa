[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vexa"
version = "0.3.0a1"
description = "A small interpreted language for computer vision on CPU"
readme = "README.md"
license = "MIT AND AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE-MODEL"]
authors = [{name = "Dharunkumar Senthilkumar"}]
requires-python = ">=3.12,<3.13"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "lark>=1.2,<2",
  "onnxruntime>=1.20,<2",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "platformdirs>=4,<5",
]

[project.scripts]
vexa = "vexa.cli:main"

[project.urls]
Repository = "https://github.com/Dharun235/Vexa"
Documentation = "https://github.com/Dharun235/Vexa/blob/codex/installable-language/docs/README.md"
Issues = "https://github.com/Dharun235/Vexa/issues"

[dependency-groups]
export = ["ultralytics>=8.3,<9", "onnx>=1.17,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build]
artifacts = ["src/vexa/data/*.onnx"]

[tool.hatch.build.targets.wheel]
packages = ["src/vexa"]

[tool.hatch.build.targets.sdist]
include = ["src/vexa", "scripts", "tests", "examples/*.vexa", "docs/*.md", "README.md", "AGENTS.md", "CONTRIBUTING.md", "CHANGELOG.md", "LICENSE", "LICENSE-MODEL", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
