name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python 3.12 --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Check and format the examples
        run: |
          for program in examples/*.vexa; do uv run vexa check "$program"; done
          uv run vexa fmt --check examples/*.vexa
      - name: Compile the examples
        run: |
          mkdir -p compiled
          for program in examples/*.vexa; do
            uv run vexa compile "$program" -o "compiled/$(basename "${program%.vexa}").py"
          done
          uv run python -m py_compile compiled/*.py
