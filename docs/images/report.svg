<text x="18" y="58" xml:space="preserve"><tspan class="prompt">$ </tspan><tspan class="command">vexa run street-report.vexa --image street.jpg --set busy=2</tspan></text>
<text x="18" y="77" xml:space="preserve">param busy = 2</text>
<text x="18" y="96" xml:space="preserve">param minimum = 0.4</text>
