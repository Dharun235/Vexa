# Checks that run before every commit. Set up once with:
#   uvx pre-commit install
# They use the project's own ruff (from uv.lock), so they match CI exactly.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (syntax errors, unused imports, docstrings)
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format (Black-compatible layout)
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: vexa-fmt
        name: vexa fmt --check (example programs)
        entry: uv run --locked vexa fmt --check
        language: system
        files: ^examples/.*\.vexa$
